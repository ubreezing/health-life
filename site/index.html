<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康生活">
<title>健康生活</title>
<style>
:root{
  --teal:#1D9E75; --teal-dark:#0F6E56; --teal-bg:#E1F5EE;
  --amber:#EF9F27; --amber-bg:#FAEEDA; --amber-dark:#854F0B;
  --ink:#26261f; --ink2:#5F5E5A; --ink3:#888780;
  --page:#F5F6F2; --card:#FFFFFF; --line:#E5E7E0;
  --sab: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;min-height:100vh;min-height:100dvh}
body{max-width:560px;margin:0 auto;padding:40px 20px calc(40px + var(--sab))}
h1{font-size:30px;font-weight:800;letter-spacing:.5px}
.sub{font-size:14px;color:var(--ink3);margin-top:6px}
.list{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(20,40,30,.05),0 8px 24px -16px rgba(20,60,40,.2)}
.item:active{transform:scale(.99)}
.ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.item.a .ic{background:var(--teal-bg)}
.item.b .ic{background:var(--amber-bg)}
.item.c .ic{background:#E8EFF8}
.info{flex:1;min-width:0}
.t{font-size:17px;font-weight:800}
.d{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5}
.arrow{color:var(--ink3);font-size:18px}
.foot{margin-top:32px;font-size:12px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}
</style>
</head>
<body>
<h1>健康生活</h1>
<div class="sub">三个小工具，一个账号，多端同步</div>

<div class="list">
  <a class="item a" href="./fitness/">
    <div class="ic">🏋️</div>
    <div class="info">
      <div class="t">健身打卡</div>
      <div class="d">胸 → 背 → 肩 → 休 → 背 循环，按组勾选，自动推算下一个训练日</div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="item b" href="./diet/">
    <div class="ic">🍽️</div>
    <div class="info">
      <div class="t">轮转饮食</div>
      <div class="d">早午晚餐自动轮转推荐，记录热量与三大营养素</div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="item c" href="./weight/">
    <div class="ic">⚖️</div>
    <div class="info">
      <div class="t">体重记录</div>
      <div class="d">每天一个数，看 90 天曲线和每周趋势</div>
    </div>
    <div class="arrow">›</div>
  </a>
</div>

<div class="foot">
  两个应用里都可点右上角「仅本机 / 已同步」按钮登录，登录后数据会在手机、电脑之间自动同步。<br>
  首次登录的账号即为新建账号，手机号或邮箱都行。
</div>
</body>
</html>
